[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Enterprise RAG Assistant — hybrid retrieval + cross-encoder reranker + faithfulness scoring"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn>=1.4",
  "rank-bm25>=0.2.2",
  "matplotlib",
  "seaborn",
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "joblib",
  "pyarrow",
  "scipy",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "httpx",
  "ruff",
  "jupyterlab",
  "nbformat",
]

[tool.setuptools.packages.find]
where = ["src"]
